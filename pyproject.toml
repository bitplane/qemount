[project]
name = "mountin"
description = "Mount anything"
version = "0.1.0"
authors = [
    { name = "Gareth Davidson", email = "gaz@bitplane.net" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "msgpack",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage",
    "pytest-cov",
    "ruff",
    "mkdocs",
    "mkdocs-material",
    "pydoc-markdown"
]

[project.scripts]
mountin-build = "mountin.main:main"

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.2,<4"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
